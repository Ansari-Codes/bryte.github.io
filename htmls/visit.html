<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brython Showcase - Visits</title>
    <script src="../brython/brython.js"></script>
    <script src="../brython/brython_stdlib.js"></script>
</head>
<body>
    <h2 id="visit-label">You visited: 0 times</h2>
    <button id="clear">Clear</button>
    <script type="text/python">
from browser import document, window
# Access local storage
storage = window.localStorage
# Read previous visits or start at 0
visits = int(storage.getItem("visits") or 0)
visits += 1  # increment for this visit
# Update label
document["visit-label"].html = f"You visited: {visits} times"
# Save back to local storage
storage.setItem("visits", str(visits))
def setToZero(evt = None):
    storage.setItem('visits', str(0))
    visits = 0
    document["visit-label"].html = f"You visited: {visits} times"
document['clear'].bind('click', setToZero)
    </script>
</body>
</html>
