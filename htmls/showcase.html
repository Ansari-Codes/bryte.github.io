    <header>
        <nav id="nav"></nav>

    <script type="text/python">
from browser import document, html
def createLink(label, link):
    return html.A(href=link) <= html.P(label)
navBar = document['nav']
for i in ['showcase', 'about']:
    navBar <= createLink(i.title(), f"{i}.html")

    <div id="list"></div>
    <script type="text/python">
from browser import document, html
def createLink(label, link):
    return html.A(href=link) <= html.P(label)
navBar = document['list']
